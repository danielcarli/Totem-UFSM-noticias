# Destaques UFSM – Sistema: configurações de fábrica.
# Não edite este arquivo: as configurações desta máquina ficam em /etc/destaques-os/local.conf
# (criado pela tela de configurações do painel), que vale por cima deste.

# repositório do GitHub de onde vêm as atualizações (página de Releases)
REPO="danielcarli/Totem-UFSM-noticias"

# usuário que roda o painel em tela cheia
PAINEL_USUARIO="painel"

# opções extras do painel (as mesmas do atalho: --leve, --intervalo=12, --orientacao=vertical…)
# e do navegador interno (ex.: --disable-gpu em placas de vídeo muito antigas)
PAINEL_OPCOES=""

# como ficam as telas quando há mais de uma (notebook + TV):
#   lado-a-lado  → cada tela mostra uma coisa (o painel escolhe em qual aparece: teclas 1, 2, 3)
#   so-externa   → desliga a tela do notebook e usa só a TV / monitor externo
#   espelhar     → as duas mostram o mesmo
TELAS="lado-a-lado"

# atualização automática pela Release do GitHub: sim | nao
ATUALIZAR_SOZINHO="sim"
