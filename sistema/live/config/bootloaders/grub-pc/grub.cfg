source /boot/grub/config.cfg
set timeout=10

menuentry "Testar o Destaques UFSM (roda do pendrive, sem instalar)" --hotkey=t {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Instalar o Destaques UFSM neste computador (apaga o disco escolhido)" --hotkey=i {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ destaques.instalar
	initrd	@INITRD_LIVE@
}

menuentry "Testar em modo de vídeo seguro (placas de vídeo problemáticas)" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

if [ "${grub_platform}" = "efi" ]; then
	menuentry "Configurações da placa-mãe (UEFI)" --hotkey=f {
		fwsetup
	}
fi
