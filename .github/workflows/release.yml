# Gera os instaladores de Windows e Linux e publica na release quando uma tag vX.Y.Z é enviada:
#   git tag v1.4.0 && git push origin v1.4.0
# Os nomes dos arquivos não têm versão, para os links ".../releases/latest/download/..." do README
# sempre baixarem a versão mais recente. Os arquivos latest.yml / latest-linux.yml (e o .blockmap)
# são lidos pela atualização automática dos painéis já instalados: precisam estar na Release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:      # gera os instaladores sem publicar (ficam nos "artifacts" da execução)

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run painel -- --conferir
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Destaques-UFSM-Setup.exe
            dist/Destaques-UFSM-Setup.exe.blockmap
            dist/Destaques-UFSM-win-x64.zip
            dist/latest.yml

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run painel -- --conferir
      - run: npx electron-builder --linux --publish never
      - run: cp navegador/destaques-ufsm.html dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/destaques-ufsm_amd64.deb
            dist/destaques-ufsm.x86_64.rpm
            dist/Destaques-UFSM-x86_64.AppImage
            dist/latest-linux.yml
            dist/destaques-ufsm.html

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true
      - name: Somas de verificação (SHA-256)
        run: cd arquivos && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Destaques UFSM ${{ github.ref_name }}
          files: arquivos/*
          generate_release_notes: true
