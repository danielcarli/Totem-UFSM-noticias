# Gera os instaladores de Windows e Linux, a imagem do sistema próprio (ISO) e publica na release
# quando uma tag vX.Y.Z é enviada:
#   git tag v1.4.0 && git push origin v1.4.0
# Os nomes dos arquivos não têm versão, para os links ".../releases/latest/download/..." do README
# sempre baixarem a versão mais recente. Os arquivos latest.yml / latest-linux.yml (e o .blockmap)
# são lidos pela atualização automática dos painéis já instalados: precisam estar na Release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:      # gera os instaladores sem publicar (ficam nos "artifacts" da execução)

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run painel -- --conferir
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Destaques-UFSM-Setup.exe
            dist/Destaques-UFSM-Setup.exe.blockmap
            dist/Destaques-UFSM-win-x64.zip
            dist/latest.yml

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run painel -- --conferir
      - run: npx electron-builder --linux --publish never
      - name: Pacote do sistema próprio (destaques-sistema_all.deb)
        run: bash sistema/construir-deb.sh
      - run: cp navegador/destaques-ufsm.html dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/destaques-ufsm_amd64.deb
            dist/destaques-ufsm.x86_64.rpm
            dist/Destaques-UFSM-x86_64.AppImage
            dist/latest-linux.yml
            dist/destaques-ufsm.html
            dist/destaques-sistema_all.deb

  # imagem do Destaques UFSM – Sistema (Debian 13 + painel), para instalar em PCs e notebooks
  sistema:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Libera espaço em disco (o live-build usa uns 8 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - name: Gera a ISO (live-build num container Debian 13)
        run: bash sistema/construir-iso.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sistema
          path: dist/Destaques-UFSM-Sistema-amd64.iso
          compression-level: 0

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, sistema]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true
      - name: Somas de verificação (SHA-256)
        run: cd arquivos && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Destaques UFSM ${{ github.ref_name }}
          files: arquivos/*
          generate_release_notes: true
